{% extends "admin/base_site.html" %}
{% load i18n %}

{% block title %}Import Router Serials{% endblock %}

{% block content %}
<h2>Import Router Serial Numbers</h2>
<p>Upload a text file or CSV with one serial number per line. Lines starting with <code>#</code> are skipped.</p>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <fieldset class="module aligned">
        <div class="form-row">
            <label for="serial_file">Serial file (.txt or .csv):</label>
            <input type="file" name="serial_file" id="serial_file" accept=".txt,.csv" required>
        </div>
    </fieldset>
    <div class="submit-row">
        <input type="submit" value="Import" class="default">
        <a href="{% url 'admin:routers_router_changelist' %}">Cancel</a>
    </div>
</form>
{% endblock %}
