{% extends "admin/change_list.html" %}

{% block object-tools-items %}
    {% if generic_bootstrap_url %}
    <li>
        <a href="{{ generic_bootstrap_url }}" class="button" style="background: #10b981;">
            ⬇ Download Generic Bootstrap .rsc
        </a>
    </li>
    {% endif %}
    {% if openwrt_firmware_url %}
    <li>
        <a href="{{ openwrt_firmware_url }}" class="button"
           style="background: {% if openwrt_firmware_exists %}#3b82f6{% else %}#9ca3af{% endif %};"
           {% if not openwrt_firmware_exists %}title="Firmware not built yet. Run: manage.py build_openwrt_firmware"{% endif %}>
            ⬇ Download OpenWrt Firmware (.bin)
        </a>
    </li>
    {% endif %}
    {{ block.super }}
{% endblock %}
