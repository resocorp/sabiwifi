{% extends "base.html" %}
{% block title %}Log In — SabiWiFi{% endblock %}

{% block body %}
<div class="min-h-screen flex items-center justify-center px-4 py-8 bg-bg-gray">
    <div class="w-full max-w-sm">
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="{% url 'landing' %}" class="text-primary font-heading font-bold text-2xl">SabiWiFi</a>
        </div>

        <div class="bg-white rounded-xl border border-border p-6">
            <h1 class="font-heading font-bold text-xl mb-6">Log In</h1>

            {% if errors.non_field_errors %}
            <div class="bg-red-50 border border-red-200 rounded-lg p-3 mb-4 text-sm text-red-800">
                {% for error in errors.non_field_errors %}{{ error }}{% endfor %}
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">Email</label>
                    <input type="email" name="email" value="{{ email|default:'' }}" required autofocus
                           class="w-full px-3 py-2.5 border border-border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary">
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" name="password" required
                           class="w-full px-3 py-2.5 border border-border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary">
                </div>

                <button type="submit"
                        class="w-full bg-primary text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-primary-dark transition">
                    Log In
                </button>
            </form>
        </div>

        <p class="text-center text-sm text-text-secondary mt-4">
            Don't have an account?
            <a href="{% url 'signup' %}" class="text-primary hover:underline font-medium">Sign up — it's free</a>
        </p>
    </div>
</div>
{% endblock %}
