<script>

  if (d) document.documentElement.classList.add('dark');
})();
</script>

<!-- Theme toggle utility — available globally -->
<script>
window.SabiTheme = {
    get: function() {
        return localStorage.getItem('sabiwifi-theme') || 'system';
    },
    set: function(mode) {
        localStorage.setItem('sabiwifi-theme', mode);
        this.apply();
    },
    apply: function() {
        var stored = this.get();
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = stored === 'dark' || (stored === 'system' && prefersDark);
        document.documentElement.classList.toggle('dark', isDark);
    },
    cycle: function() {
        var current = this.get();
        var next = current === 'light' ? 'dark' : current === 'dark' ? 'system' : 'light';
        this.set(next);
        return next;
    },
    icon: function() {
        var m = this.get();
        return m === 'light' ? 'light_mode' : m === 'dark' ? 'dark_mode' : 'brightness_auto';
    },
    label: function() {
        var m = this.get();
        return m === 'light' ? 'Light' : m === 'dark' ? 'Dark' : 'System';
    }
};
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
    if (SabiTheme.get() === 'system') SabiTheme.apply();
});
</script>
