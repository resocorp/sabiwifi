<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connected!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F7F8FA; color: #1A1A2E; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .card { background: #fff; border-radius: 16px; padding: 32px 24px; box-shadow: 0 1px 3px rgba(0,0,0,.08); text-align: center; max-width: 360px; width: 100%; }
        .check { font-size: 48px; margin-bottom: 16px; }
        h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
        p { font-size: 14px; color: #6B7280; }
    </style>
</head>
<body>
    <div class="card">
        <div class="check">✅</div>
        <h1>You're Connected!</h1>
        <p>Enjoy your internet. You can manage your account at<br><a href="/portal/account/" style="color:#0052CC;font-weight:600;">My Account</a></p>
    </div>
</body>
</html>
