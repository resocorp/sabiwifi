<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account — {% if branding.portal_title %}{{ branding.portal_title }}{% else %}SabiWiFi{% endif %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F7F8FA; color: #1A1A2E; min-height: 100vh; padding: 16px; }
        .container { max-width: 400px; margin: 0 auto; }
        .card { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 16px; }
        .logo { text-align: center; margin-bottom: 12px; }
        .logo img { max-width: 100px; max-height: 50px; }
        h1 { font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 16px; }
        h2 { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
        .info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #F3F4F6; font-size: 14px; }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: #6B7280; }
        .info-value { font-weight: 500; text-align: right; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .badge-active { background: #D1FAE5; color: #065F46; }
        .badge-expired { background: #FEE2E2; color: #991B1B; }
        .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; margin-top: 8px; }
        .btn-primary { background: {{ branding.primary_color|default:"#0052CC" }}; color: #fff; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-outline { background: transparent; border: 1px solid #E5E7EB; color: #1A1A2E; }
        .btn-danger { background: transparent; border: 1px solid #FECACA; color: #991B1B; }
        .btn-sm { padding: 8px 16px; font-size: 13px; display: inline-block; width: auto; }
        label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; margin-top: 12px; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #E5E7EB; border-radius: 8px; font-size: 14px; outline: none; }
        input:focus { border-color: {{ branding.primary_color|default:"#0052CC" }}; box-shadow: 0 0 0 3px {{ branding.primary_color|default:"#0052CC" }}22; }
        .pin-input { font-size: 18px; text-align: center; letter-spacing: 4px; }
        .error { background: #FEE2E2; border: 1px solid #FECACA; color: #991B1B; padding: 8px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; display: none; }
        .success { background: #D1FAE5; border: 1px solid #A7F3D0; color: #065F46; padding: 8px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; display: none; }
        .plan-card { border: 1px solid #E5E7EB; border-radius: 12px; padding: 16px; margin-bottom: 8px; cursor: pointer; transition: border-color 0.2s; }
        .plan-card:hover { border-color: {{ branding.primary_color|default:"#0052CC" }}; }
        .plan-card.current { border-color: #10B981; background: #F0FDF4; }
        .plan-name { font-weight: 600; font-size: 15px; }
        .plan-details { font-size: 13px; color: #6B7280; margin-top: 4px; }
        .plan-price { font-size: 18px; font-weight: 700; color: {{ branding.primary_color|default:"#0052CC" }}; margin-top: 4px; }
        .section { display: none; }
        .section.active { display: block; }
        .text-center { text-align: center; }
        .text-muted { color: #6B7280; font-size: 13px; }
        .mt-8 { margin-top: 8px; }
        .mt-16 { margin-top: 16px; }
        /* Login section */
        #login-section .card { max-width: 360px; margin: 0 auto; margin-top: 10vh; }
    </style>
</head>
<body>
    <div class="container">

        <!-- Login Section -->
        <div id="login-section" class="section active">
            <div class="card">
                {% if branding.logo %}
                <div class="logo"><img src="{{ branding.logo }}" alt="Logo"></div>
                {% endif %}
                <h1>My Account</h1>
                <div id="login-msg"></div>
                <label>Phone Number</label>
                <input type="tel" id="login-phone" placeholder="08066..." inputmode="numeric">
                <label>WiFi PIN</label>
                <input type="password" id="login-pin" class="pin-input" maxlength="6" inputmode="numeric" placeholder="----">
                <button class="btn btn-primary mt-16" id="login-btn" onclick="doLogin()">Log In</button>
                <p class="text-center text-muted mt-8">
                    <a href="#" onclick="showSection('reset-section'); return false;" style="color: {{ branding.primary_color|default:'#0052CC' }}; text-decoration: none;">Forgot PIN?</a>
                </p>
            </div>
        </div>

        <!-- PIN Reset Section -->
        <div id="reset-section" class="section">
            <div class="card">
                <h2>Reset PIN</h2>
                <div id="reset-msg"></div>
                <div id="reset-step-1">
                    <label>Phone Number</label>
                    <input type="tel" id="reset-phone" placeholder="08066..." inputmode="numeric">
                    <button class="btn btn-primary mt-16" onclick="doResetRequest()">Send Reset Code</button>
                </div>
                <div id="reset-step-2" style="display:none;">
                    <label>Verification Code</label>
                    <input type="text" id="reset-code" maxlength="6" inputmode="numeric" style="text-align:center; letter-spacing:8px;" placeholder="------">
                    <label>New PIN</label>
                    <input type="password" id="reset-new-pin" class="pin-input" maxlength="6" inputmode="numeric" placeholder="----">
                    <label>Confirm New PIN</label>
                    <input type="password" id="reset-confirm-pin" class="pin-input" maxlength="6" inputmode="numeric" placeholder="----">
                    <button class="btn btn-primary mt-16" onclick="doResetConfirm()">Reset PIN</button>
                </div>
                <button class="btn btn-outline mt-8" onclick="showSection('login-section')">Back to Login</button>
            </div>
        </div>

        <!-- Account Dashboard -->
        <div id="account-section" class="section">
            {% if branding.logo %}
            <div class="logo"><img src="{{ branding.logo }}" alt="Logo"></div>
            {% endif %}

            <div id="acct-msg"></div>

            <!-- Profile Card -->
            <div class="card">
                <h2>My Plan</h2>
                <div id="plan-info">
                    <p class="text-muted">Loading...</p>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="card">
                <h2>Account</h2>
                <div class="info-row">
                    <span class="info-label">Phone</span>
                    <span class="info-value" id="acct-phone">—</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Email</span>
                    <span class="info-value" id="acct-email">—</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Member Since</span>
                    <span class="info-value" id="acct-joined">—</span>
                </div>
                <button class="btn btn-outline mt-8" onclick="showSection('change-pin-section')">Change WiFi PIN</button>
                <button class="btn btn-outline mt-8" onclick="loadPlans()">Change Plan</button>
            </div>

            <!-- Payment History -->
            <div class="card">
                <h2>Payment History</h2>
                <div id="payment-list">
                    <p class="text-muted">No payments yet.</p>
                </div>
            </div>

            <button class="btn btn-danger mt-8" onclick="doLogout()">Log Out</button>
        </div>

        <!-- Change PIN Section -->
        <div id="change-pin-section" class="section">
            <div class="card">
                <h2>Change WiFi PIN</h2>
                <div id="pin-msg"></div>
                <label>Current PIN</label>
                <input type="password" id="cp-current" class="pin-input" maxlength="6" inputmode="numeric" placeholder="----">
                <label>New PIN</label>
                <input type="password" id="cp-new" class="pin-input" maxlength="6" inputmode="numeric" placeholder="----">
                <label>Confirm New PIN</label>
                <input type="password" id="cp-confirm" class="pin-input" maxlength="6" inputmode="numeric" placeholder="----">
                <button class="btn btn-primary mt-16" onclick="doChangePin()">Update PIN</button>
                <button class="btn btn-outline mt-8" onclick="showSection('account-section')">Cancel</button>
            </div>
        </div>

        <!-- Change Plan Section -->
        <div id="plans-section" class="section">
            <div class="card">
                <h2>Available Plans</h2>
                <div id="plans-list">
                    <p class="text-muted">Loading plans...</p>
                </div>
                <button class="btn btn-outline mt-8" onclick="showSection('account-section')">Back</button>
            </div>
        </div>

    </div>

    <script>
    let authToken = localStorage.getItem('sabiwifi_token') || '';
    let resellerSlug = '{{ reseller.slug|default:""|escapejs }}';
    const serial = '{{ serial|default:""|escapejs }}';

    function showMsg(containerId, text, type) {
        const el = document.getElementById(containerId);
        el.className = type === 'error' ? 'error' : 'success';
        el.textContent = text;
        el.style.display = 'block';
    }
    function hideMsg(containerId) {
        document.getElementById(containerId).style.display = 'none';
    }

    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function formatDate(iso) {
        if (!iso) return '—';
        const d = new Date(iso);
        return d.toLocaleDateString('en-NG', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    // --- Login ---
    function doLogin() {
        const phone = document.getElementById('login-phone').value.trim();
        const pin = document.getElementById('login-pin').value.trim();
        const btn = document.getElementById('login-btn');
        if (!phone || !pin) { showMsg('login-msg', 'Enter phone and PIN.', 'error'); return; }
        hideMsg('login-msg');
        btn.disabled = true; btn.textContent = 'Logging in...';

        fetch('/api/portal/login/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({phone, pin, serial}),
        })
        .then(r => r.json().then(data => ({ok: r.ok, data})))
        .then(({ok, data}) => {
            btn.disabled = false; btn.textContent = 'Log In';
            if (ok) {
                authToken = data.auth_token;
                resellerSlug = data.reseller_slug || resellerSlug;
                localStorage.setItem('sabiwifi_token', authToken);
                loadAccount();
            } else {
                showMsg('login-msg', data.error || 'Login failed.', 'error');
            }
        })
        .catch(() => { btn.disabled = false; btn.textContent = 'Log In'; showMsg('login-msg', 'Network error.', 'error'); });
    }

    // --- Load Account ---
    function loadAccount() {
        fetch('/api/portal/account/?token=' + encodeURIComponent(authToken))
        .then(r => r.json().then(data => ({ok: r.ok, data})))
        .then(({ok, data}) => {
            if (!ok) { doLogout(); return; }

            document.getElementById('acct-phone').textContent = data.phone;
            document.getElementById('acct-email').textContent = data.email || '—';
            document.getElementById('acct-joined').textContent = formatDate(data.joined);
            resellerSlug = data.reseller?.slug || resellerSlug;

            // Plan info
            const planEl = document.getElementById('plan-info');
            if (data.subscription) {
                const s = data.subscription;
                planEl.innerHTML = `
                    <div class="info-row"><span class="info-label">Plan</span><span class="info-value">${s.plan_name}</span></div>
                    <div class="info-row"><span class="info-label">Speed</span><span class="info-value">${s.speed_display}</span></div>
                    <div class="info-row"><span class="info-label">Data</span><span class="info-value">${s.data_cap_display}</span></div>
                    <div class="info-row"><span class="info-label">Devices</span><span class="info-value">${s.max_devices}</span></div>
                    <div class="info-row"><span class="info-label">Expires</span><span class="info-value">${formatDate(s.expiry_date)}</span></div>
                    <div class="info-row"><span class="info-label">Status</span><span class="info-value"><span class="badge ${s.days_remaining > 0 ? 'badge-active' : 'badge-expired'}">${s.days_remaining > 0 ? 'Active' : 'Expired'}</span></span></div>
                `;
            } else {
                planEl.innerHTML = '<p class="text-muted">No active plan. <a href="#" onclick="loadPlans(); return false;" style="color: var(--primary);">Choose a plan</a></p>';
            }

            // Payment history
            const payEl = document.getElementById('payment-list');
            if (data.payments && data.payments.length > 0) {
                payEl.innerHTML = data.payments.map(p => `
                    <div class="info-row">
                        <span class="info-label">${formatDate(p.date)} — ${p.plan_name}</span>
                        <span class="info-value">${parseFloat(p.amount) > 0 ? '₦' + parseFloat(p.amount).toLocaleString() : 'Free'}</span>
                    </div>
                `).join('');
            } else {
                payEl.innerHTML = '<p class="text-muted">No payments yet.</p>';
            }

            showSection('account-section');
        })
        .catch(() => { showMsg('login-msg', 'Network error.', 'error'); });
    }

    // --- Change PIN ---
    function doChangePin() {
        const current = document.getElementById('cp-current').value.trim();
        const newPin = document.getElementById('cp-new').value.trim();
        const confirm = document.getElementById('cp-confirm').value.trim();
        if (!current || !newPin || !confirm) { showMsg('pin-msg', 'Fill in all fields.', 'error'); return; }
        if (newPin !== confirm) { showMsg('pin-msg', 'PINs do not match.', 'error'); return; }
        hideMsg('pin-msg');

        fetch('/api/portal/change-pin/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-Auth-Token': authToken},
            body: JSON.stringify({current_pin: current, new_pin: newPin, new_pin_confirm: confirm}),
        })
        .then(r => r.json().then(data => ({ok: r.ok, data})))
        .then(({ok, data}) => {
            if (ok) {
                authToken = data.auth_token;
                localStorage.setItem('sabiwifi_token', authToken);
                showMsg('acct-msg', 'PIN updated successfully.', 'success');
                showSection('account-section');
            } else {
                showMsg('pin-msg', data.error || 'Failed.', 'error');
            }
        })
        .catch(() => showMsg('pin-msg', 'Network error.', 'error'));
    }

    // --- Load Plans ---
    function loadPlans() {
        showSection('plans-section');
        const params = resellerSlug ? `reseller=${resellerSlug}` : `r=${serial}`;
        fetch(`/api/portal/plans/?${params}`)
        .then(r => r.json())
        .then(data => {
            const list = document.getElementById('plans-list');
            if (!data.plans || data.plans.length === 0) {
                list.innerHTML = '<p class="text-muted">No plans available.</p>';
                return;
            }
            list.innerHTML = data.plans.map(p => `
                <div class="plan-card" onclick="selectPlan(${p.id}, '${p.name}', ${p.is_free})">
                    <div class="plan-name">${p.name}</div>
                    <div class="plan-details">${p.speed_display} · ${p.duration_display} · ${p.data_cap_display} · ${p.max_devices} device${p.max_devices > 1 ? 's' : ''}</div>
                    <div class="plan-price">${parseFloat(p.price_ngn) > 0 ? '₦' + parseFloat(p.price_ngn).toLocaleString() : 'Free'}</div>
                </div>
            `).join('');
        })
        .catch(() => {
            document.getElementById('plans-list').innerHTML = '<p class="text-muted">Failed to load plans.</p>';
        });
    }

    function selectPlan(planId, planName, isFree) {
        if (!confirm(`Switch to "${planName}"?`)) return;

        fetch('/api/portal/account/change-plan/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-Auth-Token': authToken},
            body: JSON.stringify({plan_id: planId}),
        })
        .then(r => r.json().then(data => ({ok: r.ok, data})))
        .then(({ok, data}) => {
            if (ok && !data.requires_payment) {
                showMsg('acct-msg', data.message || 'Plan activated!', 'success');
                loadAccount();
            } else if (data.requires_payment) {
                showMsg('acct-msg', 'Payment required. This feature is coming soon.', 'error');
                showSection('account-section');
            } else {
                showMsg('acct-msg', data.error || 'Failed.', 'error');
                showSection('account-section');
            }
        })
        .catch(() => { showMsg('acct-msg', 'Network error.', 'error'); showSection('account-section'); });
    }

    // --- PIN Reset ---
    function doResetRequest() {
        const phone = document.getElementById('reset-phone').value.trim();
        if (!phone) { showMsg('reset-msg', 'Enter your phone number.', 'error'); return; }
        hideMsg('reset-msg');

        fetch('/api/portal/reset-pin/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({phone}),
        })
        .then(r => r.json().then(data => ({ok: r.ok, data})))
        .then(({ok, data}) => {
            if (ok) {
                showMsg('reset-msg', 'Reset code sent to your phone.', 'success');
                document.getElementById('reset-step-1').style.display = 'none';
                document.getElementById('reset-step-2').style.display = 'block';
            } else {
                showMsg('reset-msg', data.error || 'Failed.', 'error');
            }
        })
        .catch(() => showMsg('reset-msg', 'Network error.', 'error'));
    }

    function doResetConfirm() {
        const phone = document.getElementById('reset-phone').value.trim();
        const code = document.getElementById('reset-code').value.trim();
        const newPin = document.getElementById('reset-new-pin').value.trim();
        const confirm = document.getElementById('reset-confirm-pin').value.trim();
        if (!code || !newPin || !confirm) { showMsg('reset-msg', 'Fill in all fields.', 'error'); return; }
        hideMsg('reset-msg');

        fetch('/api/portal/reset-pin/confirm/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({phone, code, new_pin: newPin, new_pin_confirm: confirm}),
        })
        .then(r => r.json().then(data => ({ok: r.ok, data})))
        .then(({ok, data}) => {
            if (ok) {
                showMsg('login-msg', 'PIN reset! You can now log in.', 'success');
                showSection('login-section');
            } else {
                showMsg('reset-msg', data.error || 'Failed.', 'error');
            }
        })
        .catch(() => showMsg('reset-msg', 'Network error.', 'error'));
    }

    // --- Logout ---
    function doLogout() {
        authToken = '';
        localStorage.removeItem('sabiwifi_token');
        showSection('login-section');
    }

    // --- Auto-login if token exists ---
    if (authToken) {
        loadAccount();
    }
    </script>
</body>
</html>
