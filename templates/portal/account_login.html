<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Your Account — SabiWiFi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f7f5; color: #2b2f2e; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .container { width: 100%; max-width: 360px; }
        .brand { text-align: center; margin-bottom: 24px; color: #006a36; font-weight: 700; font-size: 20px; }
        .card { background: #fff; border-radius: 16px; padding: 32px 24px; box-shadow: 0px 20px 40px rgba(43,47,46,0.06); }
        h1 { font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 24px; }
        label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; color: #585c5b; }
        input { width: 100%; padding: 10px 12px; border: none; border-radius: 8px; font-size: 14px; outline: none; margin-bottom: 16px; background: #d8dedc; }
        input:focus { box-shadow: 0 0 0 3px rgba(0,106,54,0.2); }
        .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; background: #006a36; color: #fff; }
        .link { color: #006a36; text-decoration: none; font-size: 13px; }
        .text-center { text-align: center; }
        .mt-3 { margin-top: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">SabiWiFi</div>
        <div class="card">
            <h1>Manage Your Account</h1>

            <form method="post">
                <label>Phone Number</label>
                <input type="tel" name="phone" placeholder="+234" required>

                <label>WiFi PIN</label>
                <input type="password" name="pin" placeholder="•••••" maxlength="8" required>

                <button type="submit" class="btn">Log In</button>
            </form>

            <p class="text-center mt-3"><a href="#" class="link">Forgot PIN?</a></p>
        </div>
    </div>
</body>
</html>
