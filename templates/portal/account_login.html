<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Your Account — SabiWiFi</title>
    <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link href="https://fonts.bunny.net/css?family=fraunces:400,500,600,700&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'General Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fafaf9; color: #0a0a0b; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .container { width: 100%; max-width: 420px; }
        .brand { font-family: 'Fraunces', ui-serif, Georgia, serif; text-align: center; margin-bottom: 24px; color: #0e3b2e; font-weight: 600; font-size: 22px; letter-spacing: -0.01em; }
        .card { background: #ffffff; border: 1px solid #e7e5e4; border-radius: 8px; padding: 32px 28px; }
        h1 { font-family: 'Fraunces', ui-serif, Georgia, serif; font-size: 21px; font-weight: 600; text-align: center; margin-bottom: 24px; letter-spacing: -0.01em; }
        label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: #6b6b6f; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #e7e5e4; border-radius: 4px; font-size: 14px; outline: none; margin-bottom: 16px; background: #f5f5f4; color: #0a0a0b; font-family: inherit; transition: border-color 120ms cubic-bezier(0.16, 1, 0.3, 1), box-shadow 120ms cubic-bezier(0.16, 1, 0.3, 1); }
        input:focus { border-color: #0e3b2e; box-shadow: 0 0 0 3px rgba(14, 59, 46, 0.15); background: #ffffff; }
        .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; background: #0e3b2e; color: #f5f5f4; font-family: inherit; transition: opacity 120ms cubic-bezier(0.16, 1, 0.3, 1); }
        .btn:hover { opacity: 0.92; }
        .link { color: #0e3b2e; text-decoration: none; font-size: 13px; font-weight: 500; }
        .link:hover { text-decoration: underline; }
        .text-center { text-align: center; }
        .mt-3 { margin-top: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">SabiWiFi</div>
        <div class="card">
            <h1>Manage Your Account</h1>

            <form method="post">
                <label>Phone Number</label>
                <input type="tel" name="phone" placeholder="+234" required>

                <label>WiFi PIN</label>
                <input type="password" name="pin" placeholder="•••••" maxlength="8" required>

                <button type="submit" class="btn">Log In</button>
            </form>

            <p class="text-center mt-3"><a href="#" class="link">Forgot PIN?</a></p>
        </div>
    </div>
</body>
</html>
