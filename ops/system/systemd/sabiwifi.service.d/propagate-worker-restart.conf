[Service]
# Keep the RQ worker in lockstep with the web service on every restart.
# The worker's Python process holds imports from ai/, conversations/, and
# tickets/, so leaving it running after a git pull silently breaks jobs
# with ImportError / AttributeError. The leading `-` on ExecStartPost
# ignores failures (so a missing worker unit won't block web start), and
# try-restart is a no-op if the worker isn't already running (idempotent
# on first boot).
# The `+` prefix escalates this post-hook to run as root (the main service
# runs as User=www-data, which cannot manage system units). The `-` prefix
# swallows failures so a missing worker unit or transient systemctl error
# won't mark sabiwifi.service itself as failed.
ExecStartPost=+-/bin/systemctl try-restart sabiwifi-rqworker.service
